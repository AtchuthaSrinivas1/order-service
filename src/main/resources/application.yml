server:
  servlet:
    context-path: /api

spring:
  application:
    name: order-service

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=order;encrypt=false;trustServerCertificate=true
    username: sa
    password: zaq1ZAQ!

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    #    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: dbo

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000 # 5 seconds
            read-timeout: 10000
            # To apply custom timeouts to a specific client interface, swap the default keyword with the value declared in your client's @FeignClient(name = "your-client-name")
          product-service:
            connect-timeout: 2000
            read-timeout: 10000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


resilience4j:
  retry:
    instances:
      productServiceRetry:
        max-attempts: 3                      # Initial call + 2 retries
        wait-duration: 2s                    # Fixed delay between attempts
        enable-exponential-backoff: true     # Delays increase progressively
        exponential-backoff-multiplier: 2    # Multiplies duration sequentially (2s, 4s...)
        retry-exceptions:                    # Retry only for these exceptions
          - feign.RetryableException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - com.ecommerce.order_service.exception.ProductServiceUnavailableException
        ignore-exceptions:                  # never retry these
          - com.ecommerce.order_service.exception.ProductNotFoundException
          - com.ecommerce.order_service.exception.InvalidProductDataException
          - com.ecommerce.order_service.exception.OutOfStockException

  circuitbreaker:
    instances:
      productServiceCB:
        sliding-window-type: COUNT_BASED
        # Number of recent requests to consider while calculating the failure rate.
        sliding-window-size: 10
        # CB starts evaluating only after at least 5 completed requests. This is different from Retry's max-attempts, which is per individual request.
        minimum-number-of-calls: 5
        # Open the circuit if 50% or more of the evaluated requests fail.
        failure-rate-threshold: 50
        # Keep the circuit OPEN for 10 sec before allowing test requests.
        wait-duration-in-open-state: 10s
        # Number of test requests allowed in HALF_OPEN state to determine if the service has recovered.
        permitted-number-of-calls-in-half-open-state: 3
        # Automatically move from OPEN to HALF_OPEN after the wait duration.
        automatic-transition-from-open-to-half-open-enabled: true

  bulkhead:
    instances:
      productServiceBulkhead:
        # Only 20 requests can call Product Service simultaneously. if all 20 ae busy, don't wait throw BulkheadFullException.
        max-concurrent-calls: 20
        # Don't wait for a permit. Fail immediately.
        max-wait-duration: 0ms

  ratelimiter:
    instances:
      productServiceRateLimiter:
        # Maximum requests allowed during one refresh period.
        # Here only 5 requests are permitted every 10 seconds.
        limit-for-period: 5
        # Time window after which the request count resets.
        # Every 10 seconds, client get another 5 requests.
        limit-refresh-period: 10s
        # Maximum time to wait for permission.
        # 0ms means fail immediately if the limit is exhausted.
        timeout-duration: 0s

logging:
  level:
    com.ecommerce.product_service: INFO
    org.springframework.web: INFO
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG
  pattern:
    # Recommended to create logback-spring.xml
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{X-Correlation-ID}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

product:
  service:
    url: ${BASE_PRODUCT_SERVICE_URL:http://localhost:8081}
